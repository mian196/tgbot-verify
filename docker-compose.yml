services:
  mysql:
    image: mysql:8.0
    container_name: sheerid-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tgbot_verify}
      MYSQL_USER: ${MYSQL_USER:-tgbot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Karachi
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  tgbot:
    build: .
    container_name: sheerid-tgbot
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

    # Environment variables
    environment:
      TZ: Asia/Karachi
      PYTHONUNBUFFERED: "1"
      # Telegram Bot configuration
      BOT_TOKEN: ${BOT_TOKEN}
      CHANNEL_USERNAME: ${CHANNEL_USERNAME:-pk_oa}
      CHANNEL_URL: ${CHANNEL_URL:-https://t.me/pk_oa}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      # MySQL configuration
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-tgbot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tgbot_verify}

    # Persist logs
    volumes:
      - ./logs:/app/logs

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql_data:
